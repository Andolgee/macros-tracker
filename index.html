<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Tracker</title>

    <!-- styles -->
    <link rel="stylesheet" href="style.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
    <div class="container">
        <h1>FOOD TRACKER</h1>

        <!-- ========= INPUT ========= -->
        <div id="input-section">
            <h2>Enter nutrition info</h2>

            <form id="food-form">
                <label for="frequent-foods">Frequent Foods:</label>
                <select id="frequent-foods">
                    <option value="">Select a frequent food</option>
                </select>

                <label for="meal">Meal:</label>
                <select id="meal" required>
                    <option value="breakfast">Breakfast</option>
                    <option value="lunch">Lunch</option>
                    <option value="dinner">Dinner</option>
                    <option value="snack">Snack</option>
                </select>

                <label for="food-name">Food Name:</label>
                <input type="text" id="food-name" required>

                <label for="calories">Calories:</label>
                <input type="number" id="calories" class="macro-input" required>

                <label for="carbs">Carbohydrates&nbsp;(g):</label>
                <input type="number" id="carbs" class="macro-input" required>

                <label for="proteins">Proteins&nbsp;(g):</label>
                <input type="number" id="proteins" class="macro-input" required>

                <label for="fats">Fats&nbsp;(g):</label>
                <input type="number" id="fats" class="macro-input" required>

                <button type="submit">Add Food</button>
            </form>

            <button id="save-frequent-food">Save Frequent Food</button>

            <!-- ========= FOOD LIST ========= -->
            <h2>Today's Food</h2>
            <div id="food-list" class="food-list"></div>
        </div>

        <!-- ========= TARGET ========= -->
        <div id="target-section">
            <h2>Set Daily Target</h2>
            <label for="target-calories">Target Calories:</label>
            <input type="number" id="target-calories" class="macro-input" required>
            <button id="set-target">Set Target</button>
        </div>

        <!-- ========= TOTALS ========= -->
        <div id="output-section">
            <h2>Daily Totals</h2>

            <div id="totals">
                <p>Calories: <span id="total-calories">0</span> /
                   <span id="target-total-calories">0</span>
                   (Left: <span id="left-calories" class="left-value">0</span>)</p>

                <p>Carbohydrates: <span id="total-carbs">0</span>g /
                   <span id="target-total-carbs">0</span>g
                   (Left: <span id="left-carbs" class="left-value">0</span>g)</p>

                <p>Proteins: <span id="total-proteins">0</span>g /
                   <span id="target-total-proteins">0</span>g
                   (Left: <span id="left-proteins" class="left-value">0</span>g)</p>

                <p>Fats: <span id="total-fats">0</span>g /
                   <span id="target-total-fats">0</span>g
                   (Left: <span id="left-fats" class="left-value">0</span>g)</p>
            </div>

            <button id="reset-totals">Reset</button>
            <button id="save-csv">Save as CSV</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
