<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Tracker</title>

    <!-- fonts (falls back to Courier New / system monospace when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

    <!-- styles -->
    <link rel="stylesheet" href="style.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
    <div class="container">

        <!-- ========= HEADER ========= -->
        <header class="top">
            <h1 class="brand">FOOD_TRACKER<span class="cursor">_</span></h1>
            <div class="meta"><span id="today-date"></span></div>
        </header>

        <!-- ========= INPUT ========= -->
        <section id="input-section" class="sec">
            <h2 class="label">ADD FOOD</h2>

            <form id="food-form">
                <label class="field"><span>PRESET</span>
                    <select id="frequent-foods">
                        <option value="">Select a frequent food</option>
                    </select>
                </label>

                <div class="row2">
                    <label class="field"><span>MEAL</span>
                        <select id="meal" required>
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </label>
                    <label class="field"><span>NAME</span>
                        <input type="text" id="food-name" autocomplete="off" required>
                    </label>
                </div>

                <div class="macros">
                    <label class="field"><span>KCAL</span>
                        <input type="number" id="calories" class="macro-input" step="any" inputmode="decimal" required></label>
                    <label class="field"><span>CARBS g</span>
                        <input type="number" id="carbs" class="macro-input" step="any" inputmode="decimal" required></label>
                    <label class="field"><span>PROT g</span>
                        <input type="number" id="proteins" class="macro-input" step="any" inputmode="decimal" required></label>
                    <label class="field"><span>FATS g</span>
                        <input type="number" id="fats" class="macro-input" step="any" inputmode="decimal" required></label>
                </div>

                <div class="btns">
                    <button type="submit">+ Add</button>
                    <button type="button" id="save-frequent-food" class="ghost">Save preset</button>
                </div>
            </form>
        </section>

        <!-- ========= TOTALS ========= -->
        <section id="output-section" class="sec">
            <h2 class="label">TOTALS</h2>

            <!-- each tile fills left to right (--pct) as the total approaches its target -->
            <div id="totals" class="tiles">
                <div class="tile t-calories" id="tile-calories">
                    <span class="k">KCAL</span>
                    <span class="l"><span id="left-calories">0</span> <span class="lw">left</span></span>
                    <span class="v"><span id="total-calories">0</span>
                        <i>/ <span id="target-total-calories">0</span></i></span>
                </div>
                <div class="tile t-carbs" id="tile-carbs">
                    <span class="k">CARBS</span>
                    <span class="l"><span id="left-carbs">0</span>g <span class="lw">left</span></span>
                    <span class="v"><span id="total-carbs">0</span>g
                        <i>/ <span id="target-total-carbs">0</span>g</i></span>
                </div>
                <div class="tile t-proteins" id="tile-proteins">
                    <span class="k">PROT</span>
                    <span class="l"><span id="left-proteins">0</span>g <span class="lw">left</span></span>
                    <span class="v"><span id="total-proteins">0</span>g
                        <i>/ <span id="target-total-proteins">0</span>g</i></span>
                </div>
                <div class="tile t-fats" id="tile-fats">
                    <span class="k">FATS</span>
                    <span class="l"><span id="left-fats">0</span>g <span class="lw">left</span></span>
                    <span class="v"><span id="total-fats">0</span>g
                        <i>/ <span id="target-total-fats">0</span>g</i></span>
                </div>
            </div>
        </section>

        <!-- ========= FOOD LIST ========= -->
        <section class="sec">
            <h2 class="label">TODAY</h2>
            <div id="food-list" class="food-list"></div>
        </section>

        <!-- ========= TARGET ========= -->
        <section id="target-section" class="sec">
            <h2 class="label">TARGET</h2>
            <div class="target-row">
                <label class="field"><span>DAILY KCAL</span>
                    <input type="number" id="target-calories" class="macro-input" step="any" inputmode="decimal" required>
                </label>
                <button id="set-target" class="ghost">Set</button>
            </div>
        </section>

        <!-- ========= RESET / CSV ========= -->
        <div class="foot">
            <button id="reset-totals">Reset</button>
            <button id="save-csv" class="ghost">Save as CSV</button>
        </div>

        <!-- ========= SYNC SETTINGS ========= -->
        <details id="sync-settings">
            <summary>⚙ SYNC SETTINGS</summary>
            <label class="field"><span>APPS SCRIPT URL</span>
                <input type="url" id="sync-url"></label>
            <label class="field"><span>TOKEN</span>
                <input type="password" id="sync-token"></label>
            <div class="sync-btns">
                <button id="save-sync" class="ghost">Save</button>
                <button id="test-sync" class="ghost">Test</button>
                <span id="sync-status"></span>
            </div>
        </details>
    </div>

    <!-- ========= EDIT ENTRY (opens when a food row is tapped) ========= -->
    <div id="editor" class="overlay" hidden>
        <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="editor-title" tabindex="-1">
            <h2 class="label"><span id="editor-title">EDIT ENTRY</span>
                <button type="button" id="edit-star" class="star" aria-label="Save as preset">☆</button></h2>

            <div class="row2">
                <label class="field"><span>MEAL</span>
                    <select id="edit-meal">
                        <option value="breakfast">Breakfast</option>
                        <option value="lunch">Lunch</option>
                        <option value="dinner">Dinner</option>
                        <option value="snack">Snack</option>
                    </select>
                </label>
                <label class="field"><span>NAME</span>
                    <input type="text" id="edit-name" autocomplete="off"></label>
            </div>

            <div class="macros">
                <label class="field"><span>KCAL</span>
                    <input type="number" id="edit-calories" step="any" inputmode="decimal"></label>
                <label class="field"><span>CARBS g</span>
                    <input type="number" id="edit-carbs" step="any" inputmode="decimal"></label>
                <label class="field"><span>PROT g</span>
                    <input type="number" id="edit-proteins" step="any" inputmode="decimal"></label>
                <label class="field"><span>FATS g</span>
                    <input type="number" id="edit-fats" step="any" inputmode="decimal"></label>
            </div>

            <div class="btns">
                <button type="button" id="edit-save">Save</button>
                <button type="button" id="edit-cancel" class="ghost">Cancel</button>
            </div>
            <button type="button" id="edit-delete" class="danger">Delete entry</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
