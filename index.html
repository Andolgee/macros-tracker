<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Tracker</title>

    <!-- fonts (falls back to Courier New / system monospace when offline) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" />

    <!-- styles -->
    <link rel="stylesheet" href="style.css" />

    <!-- PWA -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#000000" />
    <link rel="icon" href="icons/icon-192.png" />
</head>
<body>
    <div class="container">

        <!-- ========= HEADER ========= -->
        <header class="top">
            <h1 class="brand">FOOD_TRACKER<span class="cursor">_</span></h1>
            <div class="meta"><span id="today-date"></span></div>
        </header>

        <!-- ========= INPUT ========= -->
        <section id="input-section" class="sec">
            <h2 class="label">ADD FOOD</h2>

            <form id="food-form">
                <label class="field"><span>PRESET</span>
                    <select id="frequent-foods">
                        <option value="">Select a frequent food</option>
                    </select>
                </label>

                <div class="row2">
                    <label class="field"><span>MEAL</span>
                        <select id="meal" required>
                            <option value="breakfast">Breakfast</option>
                            <option value="lunch">Lunch</option>
                            <option value="dinner">Dinner</option>
                            <option value="snack">Snack</option>
                        </select>
                    </label>
                    <label class="field"><span>NAME</span>
                        <input type="text" id="food-name" autocomplete="off" required>
                    </label>
                </div>

                <div class="macros">
                    <label class="field"><span>KCAL</span>
                        <input type="number" id="calories" class="macro-input" step="any" inputmode="decimal" required></label>
                    <label class="field"><span>CARBS g</span>
                        <input type="number" id="carbs" class="macro-input" step="any" inputmode="decimal" required></label>
                    <label class="field"><span>PROT g</span>
                        <input type="number" id="proteins" class="macro-input" step="any" inputmode="decimal" required></label>
                    <label class="field"><span>FATS g</span>
                        <input type="number" id="fats" class="macro-input" step="any" inputmode="decimal" required></label>
                </div>

                <div class="btns">
                    <button type="submit">+ Add</button>
                    <button type="button" id="save-frequent-food" class="ghost">Save preset</button>
                </div>
            </form>
        </section>

        <!-- ========= TOTALS ========= -->
        <section id="output-section" class="sec">
            <h2 class="label">TOTALS</h2>

            <div id="totals">
                <p>Calories: <span id="total-calories">0</span> /
                   <span id="target-total-calories">0</span>
                   (Left: <span id="left-calories" class="left-value">0</span>)</p>

                <p>Carbohydrates: <span id="total-carbs">0</span>g /
                   <span id="target-total-carbs">0</span>g
                   (Left: <span id="left-carbs" class="left-value">0</span>g)</p>

                <p>Proteins: <span id="total-proteins">0</span>g /
                   <span id="target-total-proteins">0</span>g
                   (Left: <span id="left-proteins" class="left-value">0</span>g)</p>

                <p>Fats: <span id="total-fats">0</span>g /
                   <span id="target-total-fats">0</span>g
                   (Left: <span id="left-fats" class="left-value">0</span>g)</p>
            </div>
        </section>

        <!-- ========= FOOD LIST ========= -->
        <section class="sec">
            <h2 class="label">TODAY</h2>
            <div id="food-list" class="food-list"></div>
        </section>

        <!-- ========= TARGET ========= -->
        <section id="target-section" class="sec">
            <h2 class="label">TARGET</h2>
            <div class="target-row">
                <label class="field"><span>DAILY KCAL</span>
                    <input type="number" id="target-calories" class="macro-input" step="any" inputmode="decimal" required>
                </label>
                <button id="set-target" class="ghost">Set</button>
            </div>
        </section>

        <!-- ========= RESET / CSV ========= -->
        <div class="foot">
            <button id="reset-totals">Reset</button>
            <button id="save-csv" class="ghost">Save as CSV</button>
        </div>

        <!-- ========= SYNC SETTINGS ========= -->
        <details id="sync-settings">
            <summary>⚙ SYNC SETTINGS</summary>
            <label class="field"><span>APPS SCRIPT URL</span>
                <input type="url" id="sync-url"></label>
            <label class="field"><span>TOKEN</span>
                <input type="password" id="sync-token"></label>
            <div class="sync-btns">
                <button id="save-sync" class="ghost">Save</button>
                <button id="test-sync" class="ghost">Test</button>
                <span id="sync-status"></span>
            </div>
        </details>
    </div>

    <script src="script.js"></script>
</body>
</html>
